<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOARA.AI - Financial Management System</title>
    <meta name="description" content="SOARA.AI - Sistem Manajemen Keuangan berbasis AI untuk bisnis digital">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #e2e8f0; /* Diubah lebih gelap agar card putih lebih menonjol */
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #soara-app-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #f1f5f9; /* Background utama aplikasi */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hide { display: none !important; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* App Style Bottom Nav Active Indicator - Dipercantik agar tidak polos */
        .nav-item {
            position: relative;
            padding-top: 8px;
        }
        .nav-item.active {
            color: #1e40af;
            font-weight: 700;
        }
        .nav-item.active .icon-container {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: #ffffff;
            transform: translateY(-8px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
            border-radius: 16px;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            z-index: 99999;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 0;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="soara-app-root">

    <div id="login-screen" class="w-full h-full flex items-center justify-center bg-slate-900 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop')">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md"></div>
        <div class="relative z-10 w-full max-w-md p-8 bg-white/95 rounded-[2rem] shadow-2xl m-4 border border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-blue-800 rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-blue-500/40 transform rotate-3 hover:rotate-0 transition-transform">
                    <i class="fa-solid fa-chart-line text-white text-4xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-800">SOARA.AI</h1>
                <p class="text-slate-500 text-sm mt-1 font-semibold">Financial Management System</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-user text-slate-400"></i>
                            </div>
                            <input type="text" id="login-username" required autocomplete="username"
                                class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-semibold text-slate-700"
                                placeholder="Masukkan username">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400"></i>
                            </div>
                            <input type="password" id="login-password" required autocomplete="current-password"
                                class="w-full pl-12 pr-12 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-semibold text-slate-700"
                                placeholder="••••••••">
                            <button type="button" onclick="togglePasswordVisibility()"
                                class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-blue-600 transition-colors">
                                <i id="eye-icon" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="login-alert" class="hidden bg-red-50 text-red-600 text-sm p-4 rounded-2xl flex items-center gap-3 font-bold border border-red-100">
                        <i class="fa-solid fa-circle-exclamation text-lg"></i>
                        <span id="login-alert-msg">Username atau password salah!</span>
                    </div>

                    <button type="submit" id="btn-login"
                        class="w-full bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-900 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 transform active:scale-[0.98]">
                        <span>Masuk Sistem</span>
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="main-app" class="hidden w-full h-full flex bg-slate-50 relative">

        <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/60 z-30 hidden backdrop-blur-sm" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="sidebar-transition fixed inset-y-0 left-0 z-40 w-72 bg-white flex flex-col transform -translate-x-full rounded-r-[2rem] shadow-[10px_0_30px_rgba(0,0,0,0.05)] h-full">
            <div class="p-6 flex items-center justify-between border-b border-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-chart-line text-white text-lg"></i>
                    </div>
                    <span class="font-extrabold text-2xl text-slate-800">SOARA<span class="text-blue-600">.AI</span></span>
                </div>
                <button class="text-slate-400 hover:text-red-500 bg-slate-50 w-8 h-8 rounded-full flex items-center justify-center transition-colors" onclick="toggleSidebar()">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="px-6 py-4">
                <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100 flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-r from-blue-600 to-blue-800 flex items-center justify-center text-white font-bold text-xl shadow-inner" id="user-avatar">A</div>
                    <div>
                        <p class="text-sm font-bold text-slate-800 line-clamp-1" id="user-name-display">Admin</p>
                        <p class="text-xs text-blue-600 font-bold" id="user-role-display">Pemodal</p>
                    </div>
                </div>
            </div>

            <div class="px-4 flex-1 overflow-y-auto mt-2">
                <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-3 ml-3">Menu Sistem</p>
                <nav class="space-y-1.5" id="nav-menu"></nav>
            </div>

            <div class="p-6 border-t border-slate-50">
                <button onclick="handleLogout()"
                    class="w-full flex items-center justify-center gap-2 px-4 py-3.5 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white rounded-2xl transition-all text-sm font-bold shadow-sm">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar Akun
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-full overflow-hidden w-full relative">
            
            <header class="h-20 bg-gradient-to-r from-blue-800 to-blue-600 shadow-md flex items-center justify-between px-6 z-10 flex-shrink-0 sticky top-0">
                <div class="flex items-center gap-4">
                    <button class="w-10 h-10 bg-white/10 border border-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/20 shadow-sm transition-all" onclick="toggleSidebar()">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </button>
                    <h2 class="text-xl font-bold text-white tracking-wide" id="page-title">Dashboard</h2>
                </div>
                <div class="flex items-center gap-3 bg-white/10 border border-white/10 px-4 py-2 rounded-full hidden sm:flex">
                    <i class="fa-regular fa-calendar text-blue-200"></i>
                    <span id="current-date" class="text-sm font-bold text-white"></span>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-32 md:pb-8 scroll-smooth" id="content-area">
                </main>

            <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-100 flex justify-around items-end px-2 py-2 pb-safe z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.06)] rounded-t-[1.5rem]" id="bottom-nav">
                </nav>
        </div>
    </div>

    <div id="form-modal" class="fixed inset-0 z-[99999] hidden flex items-end sm:items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="relative bg-white rounded-t-[2rem] sm:rounded-3xl shadow-2xl w-full max-w-lg sm:m-4 flex flex-col max-h-[90vh] transition-transform transform translate-y-0 slide-up-anim">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 sm:hidden"></div>
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between flex-shrink-0 mt-2 sm:mt-0">
                <h3 class="text-xl font-bold text-slate-800" id="modal-title">Form Input</h3>
                <button onclick="closeModal()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:text-red-500 hover:bg-red-50 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="data-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="form-id">
                    <input type="hidden" id="form-type">
                    <div id="form-fields" class="space-y-5"></div>
                    <div id="reason-field" class="hidden mt-6 pt-5 border-t border-slate-100">
                        <label class="block text-sm font-bold text-amber-600 mb-2">Alasan Revisi (Wajib)</label>
                        <input type="text" id="edit-reason"
                            class="w-full px-4 py-3.5 bg-amber-50 border border-amber-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none font-semibold text-slate-700"
                            placeholder="Kenapa data ini diubah?">
                    </div>
                    <div class="mt-8 flex flex-col-reverse sm:flex-row justify-end gap-3">
                        <button type="button" onclick="closeModal()"
                            class="w-full sm:w-auto px-6 py-3.5 text-slate-600 font-bold hover:bg-slate-100 rounded-2xl transition-colors">Batal</button>
                        <button type="submit"
                            class="w-full sm:w-auto px-6 py-3.5 bg-gradient-to-r from-blue-600 to-blue-800 text-white font-bold hover:shadow-lg rounded-2xl transition-all shadow-blue-500/30">
                            Simpan Data
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="fixed inset-0 z-[99999] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 text-center animate-bounce-in">
            <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-5 relative">
                <div class="absolute inset-0 bg-red-100 rounded-full animate-ping opacity-20"></div>
                <i class="fa-solid fa-trash-can text-red-500 text-4xl relative z-10"></i>
            </div>
            <h3 class="text-2xl font-bold text-slate-800 mb-2">Hapus Data?</h3>
            <p class="text-sm text-slate-500 mb-8 font-medium">Data yang dihapus tidak dapat dikembalikan. Yakin ingin melanjutkan?</p>
            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <button onclick="closeDeleteModal()"
                    class="w-full px-6 py-3.5 text-slate-600 font-bold bg-slate-50 hover:bg-slate-100 rounded-2xl transition-colors">Batal</button>
                <button onclick="executeDelete()"
                    class="w-full px-6 py-3.5 bg-gradient-to-r from-red-500 to-red-600 text-white font-bold hover:shadow-lg rounded-2xl transition-all shadow-red-500/30">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <div id="toast" class="bg-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-slate-100 min-w-[300px]">
        <div id="toast-icon-wrapper" class="w-10 h-10 rounded-full flex items-center justify-center bg-emerald-50 flex-shrink-0">
            <i id="toast-icon" class="fa-solid fa-check text-emerald-500 text-xl"></i>
        </div>
        <div>
            <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-0.5" id="toast-title">Sukses</p>
            <p id="toast-msg" class="text-sm font-bold text-slate-800">Berhasil disimpan!</p>
        </div>
    </div>
</div>

<style>
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 8px); }
    .slide-up-anim { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-bounce-in { animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>

<script>
// ============================================================
//  KONFIGURASI
// ============================================================
const USERS = [
    { username: 'admin',   password: 'soara2024', nama: 'M Mughni Labib', role: 'Admin Pemodal' },
    { username: 'peserta', password: 'soara2024', nama: 'M Nurkholis',     role: 'Peserta'       }
];

const STORAGE_KEY = 'soara_data_v2';
const SESSION_KEY = 'soara_session';

// ============================================================
//  UTILITIES
// ============================================================
const formatRp = (angka) =>
    new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);

function showToast(msg, type = 'success') {
    const toast   = document.getElementById('toast');
    const icon    = document.getElementById('toast-icon');
    const wrapper = document.getElementById('toast-icon-wrapper');
    const title   = document.getElementById('toast-title');
    
    document.getElementById('toast-msg').textContent = msg;
    
    if (type === 'success') {
        icon.className = 'fa-solid fa-check text-emerald-500 text-xl';
        wrapper.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-emerald-50 flex-shrink-0';
        title.textContent = 'BERHASIL';
        title.className = 'text-[10px] font-extrabold text-emerald-500 uppercase tracking-widest mb-0.5';
    } else {
        icon.className = 'fa-solid fa-exclamation text-red-500 text-xl';
        wrapper.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-red-50 flex-shrink-0';
        title.textContent = 'PERHATIAN';
        title.className = 'text-[10px] font-extrabold text-red-500 uppercase tracking-widest mb-0.5';
    }
    
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

function togglePasswordVisibility() {
    const input = document.getElementById('login-password');
    const icon  = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-blue-600';
    } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
    }
}

function genId(prefix) { return prefix + '-' + Date.now(); }
function nowTimestamp() { return new Date().toISOString().replace('T', ' ').slice(0, 19); }

// ============================================================
//  DATA LAYER
// ============================================================
const defaultData = {
    deposit: [
        { id: 'DEP-1', timestamp: '2026-05-10 10:00:00', tanggal: '2026-05-10', pemodal: 'M Mughni Labib', nominal: 50000000, keterangan: 'Modal Awal', penginput: 'admin' },
        { id: 'DEP-2', timestamp: '2026-05-12 11:30:00', tanggal: '2026-05-12', pemodal: 'M Nurkholis', nominal: 50000000, keterangan: 'Modal Awal', penginput: 'admin' }
    ],
    pengeluaran: [
        { id: 'PENG-1', timestamp: '2026-05-14 09:00:00', tanggal: '2026-05-14', kategori: 'Biaya Iklan', nominal: 15000000, keterangan: 'Topup Meta Ads', penginput: 'admin' }
    ],
    omset: [
        { id: 'OMS-1', timestamp: '2026-05-16 08:00:00', bulan: '2026-05', nominal: 45000000, keterangan: 'Omset Minggu 1-2 Mei', penginput: 'admin' }
    ],
    withdraw: [ 
        { id: 'WD-1', timestamp: '2026-05-17 10:00:00', tanggal: '2026-05-17', pemodal: 'M Mughni Labib', nominal: 2000000, keterangan: 'Tarik sebagian dividen Mei', penginput: 'admin' }
    ],
    logRevisi: []
};

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        let parsed = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(defaultData));
        if (!parsed.withdraw) parsed.withdraw = [];
        return parsed;
    } catch {
        return JSON.parse(JSON.stringify(defaultData));
    }
}

function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ============================================================
//  APP STATE
// ============================================================
let appState = {
    user: null,
    currentView: 'dashboard',
    data: loadData(),
    deleteTarget: null
};

const menuItems = [
    { id: 'dashboard',   icon: 'fa-solid fa-house',                label: 'Dashboard',  mobile: true },
    { id: 'deposit',     icon: 'fa-solid fa-wallet',               label: 'Deposit',    mobile: false },
    { id: 'pengeluaran', icon: 'fa-solid fa-money-bill-transfer',  label: 'Biaya',      mobile: true },
    { id: 'omset',       icon: 'fa-solid fa-arrow-trend-up',       label: 'Omset',      mobile: true },
    { id: 'withdraw',    icon: 'fa-solid fa-hand-holding-dollar',  label: 'Withdraw',   mobile: false }, // Disembunyikan dr bottom nav agar tidak penuh, diganti Laporan
    { id: 'laporan',     icon: 'fa-solid fa-file-invoice-dollar',  label: 'Laporan',    mobile: true },
    { id: 'log',         icon: 'fa-solid fa-clock-rotate-left',    label: 'Log Revisi', mobile: false }
];

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('current-date').textContent =
        new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const savedSession = sessionStorage.getItem(SESSION_KEY);
    if (savedSession) {
        appState.user = JSON.parse(savedSession);
        showMainApp();
    }
});

// ============================================================
//  AUTH
// ============================================================
function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const btn      = document.getElementById('btn-login');
    const alertBox = document.getElementById('login-alert');

    btn.innerHTML  = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';
    btn.disabled   = true;
    alertBox.classList.add('hidden');

    setTimeout(() => {
        const user = USERS.find(u => u.username === username && u.password === password);
        if (user) {
            const userData = { username: user.username, nama: user.nama, role: user.role };
            appState.user  = userData;
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(userData));
            showMainApp();
        } else {
            document.getElementById('login-alert-msg').textContent = 'Username atau password salah!';
            alertBox.classList.remove('hidden');
            btn.innerHTML = '<span>Masuk Sistem</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
            btn.disabled  = false;
        }
    }, 500);
}

function handleLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    appState.user = null;
    document.getElementById('main-app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    const btn = document.getElementById('btn-login');
    btn.innerHTML = '<span>Masuk Sistem</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
    btn.disabled = false;
    document.getElementById('login-form').reset();
}

// ============================================================
//  NAVIGATION
// ============================================================
function showMainApp() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    document.getElementById('user-name-display').textContent  = appState.user.nama;
    document.getElementById('user-role-display').textContent  = appState.user.role;
    document.getElementById('user-avatar').textContent        = appState.user.nama.charAt(0).toUpperCase();
    renderMenu();
    loadView('dashboard');
}

function toggleSidebar() {
    const sidebar  = document.getElementById('sidebar');
    const overlay  = document.getElementById('mobile-overlay');
    const isHidden = sidebar.classList.contains('-translate-x-full');
    sidebar.classList.toggle('-translate-x-full', !isHidden);
    overlay.classList.toggle('hidden', !isHidden);
}

function renderMenu() {
    // Sidebar
    const nav = document.getElementById('nav-menu');
    nav.innerHTML = '';
    menuItems.forEach(item => {
        const isActive = appState.currentView === item.id;
        const btn = document.createElement('button');
        btn.className = `w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all font-bold text-sm text-left mb-1
            ${isActive ? 'bg-blue-600 text-white shadow-md shadow-blue-500/30' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`;
        btn.innerHTML = `
            <div class="${isActive ? 'text-white' : 'text-slate-400'} w-6 text-center text-lg">
                <i class="${item.icon}"></i>
            </div>
            <span>${item.label}</span>`;
        btn.onclick = () => {
            loadView(item.id);
            if (window.innerWidth < 768) toggleSidebar();
        };
        nav.appendChild(btn);
    });

    // Bottom Nav
    const bottomNav = document.getElementById('bottom-nav');
    bottomNav.innerHTML = '';
    const mobileItems = menuItems.filter(m => m.mobile);
    mobileItems.forEach(item => {
        const isActive = appState.currentView === item.id;
        const btn = document.createElement('button');
        btn.className = `nav-item flex flex-col items-center justify-center flex-1 transition-all ${isActive ? 'active' : 'text-slate-400 hover:text-slate-600'}`;
        btn.onclick = () => loadView(item.id);
        btn.innerHTML = `
            <div class="icon-container w-12 h-12 flex items-center justify-center rounded-2xl text-xl mb-1.5 transition-all duration-300">
                <i class="${item.icon}"></i>
            </div>
            <span class="text-[10px] font-bold ${isActive ? 'text-blue-700' : 'text-slate-500'} tracking-wide">${item.label}</span>
        `;
        bottomNav.appendChild(btn);
    });
}

function loadView(viewId) {
    appState.currentView = viewId;
    renderMenu();
    
    const titleObj = menuItems.find(m => m.id === viewId);
    let fullTitle = titleObj ? titleObj.label : 'Dashboard';
    if(viewId === 'deposit') fullTitle = 'Deposit Modal';
    if(viewId === 'pengeluaran') fullTitle = 'Biaya Operasional';
    if(viewId === 'omset') fullTitle = 'Omset Ads';
    if(viewId === 'withdraw') fullTitle = 'Riwayat Withdraw';
    document.getElementById('page-title').textContent = fullTitle;
    
    const area = document.getElementById('content-area');
    area.innerHTML = `
        <div class="flex flex-col justify-center items-center h-64 gap-4">
            <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="text-sm font-bold text-slate-400 animate-pulse">Memuat data...</p>
        </div>`;
        
    setTimeout(() => {
        switch (viewId) {
            case 'dashboard':   renderDashboard(area);   break;
            case 'deposit':     renderTableCRUD(area, 'deposit',     'Deposit Modal',       ['Tanggal', 'Pemodal',   'Keterangan', 'Nominal']); break;
            case 'pengeluaran': renderTableCRUD(area, 'pengeluaran', 'Biaya Operasional',   ['Tanggal', 'Kategori',  'Keterangan', 'Nominal']); break;
            case 'omset':       renderTableCRUD(area, 'omset',       'Omset Ads',           ['Bulan',   'Keterangan','Nominal']);                break;
            case 'withdraw':    renderTableCRUD(area, 'withdraw',    'Penarikan Dividen',   ['Tanggal', 'Pemodal',   'Keterangan', 'Nominal']); break;
            case 'laporan':     renderLaporan(area);     break;
            case 'log':         renderLogRevisi(area);   break;
        }
    }, 150);
}

// ============================================================
//  SUMMARY HELPER
// ============================================================
function getSummaryData() {
    const { deposit, pengeluaran, omset, withdraw } = appState.data;
    const totalDeposit  = deposit.reduce((s, i)    => s + Number(i.nominal), 0);
    const totalBiaya    = pengeluaran.reduce((s, i) => s + Number(i.nominal), 0);
    const totalOmset    = omset.reduce((s, i)       => s + Number(i.nominal), 0);
    const totalWithdraw = withdraw.reduce((s, i)    => s + Number(i.nominal), 0);
    const netMargin     = totalOmset - totalBiaya;
    const dividenPerOrang = netMargin > 0 ? netMargin / 2 : 0;
    return { totalDeposit, totalBiaya, totalOmset, netMargin, totalWithdraw, dividenPerOrang };
}

            <p class="font-medium text-slate-500">Belum ada data ${title.toLowerCase()}</p>
        </td></tr>`;
    } else {
        [...data].reverse().forEach(item => {
            let colHtml = '';
            if (type === 'deposit' || type === 'withdraw') {
                colHtml = `
                    <td class="px-6 py-5 whitespace-nowrap text-sm text-slate-600 font-semibold">${item.tanggal}</td>

                <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 bg-slate-200 rounded-full flex items-center justify-center text-[10px] font-bold text-slate-600">${log.pengubah.charAt(0).toUpperCase()}</div>
                        <b class="text-slate-800">${log.pengubah}</b>
                    </div>
                </td>
            </tr>`).join('');

    container.innerHTML = `
        <div class="bg-white rounded-[1.5rem] shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-200 overflow-hidden">
            <div class="px-6 py-6 border-b border-slate-100 flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div>
                    <h3 class="text-xl font-bold text-slate-800">Riwayat Perubahan</h3>
                    <p class="text-sm font-medium text-slate-500 mt-0.5">Catatan modifikasi dan penghapusan data.</p>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 border-b border-slate-100 text-[11px] uppercase text-slate-400 font-extrabold tracking-widest">
                            <th class="px-6 py-4">WAKTU</th>
                            <th class="px-6 py-4">TARGET REVISI</th>
                            <th class="px-6 py-4">DETAIL PERUBAHAN</th>
                            <th class="px-6 py-4">PENGGUNA</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white">${rowsHtml}</tbody>
                </table>
            </div>
        </div>`;
}

// ============================================================
//  FORM (CREATE / EDIT)
// ============================================================
function openForm(type, id = null) {
    document.getElementById('form-type').value = type;
    document.getElementById('form-id').value   = id || '';
    
    let titleStr = type.charAt(0).toUpperCase() + type.slice(1);
    if(type === 'withdraw') titleStr = 'Penarikan Dividen';
    
    document.getElementById('modal-title').textContent = id ? `Revisi ${titleStr}` : `Input ${titleStr}`;

    const isEdit   = !!id;
    const item     = isEdit ? appState.data[type].find(d => d.id === id) : null;
    const today    = new Date().toISOString().split('T')[0];
    const monthNow = new Date().toISOString().slice(0, 7);

    document.getElementById('reason-field').classList.toggle('hidden', !isEdit);
    document.getElementById('edit-reason').required = isEdit;

    let fieldsHtml = '';

    if (type === 'deposit' || type === 'withdraw') {
        fieldsHtml = `
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Tanggal</label>
                <input type="date" id="input-tanggal" required value="${isEdit ? item.tanggal : today}"
                    class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-semibold text-slate-700 transition-all">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Nama Pemodal</label>
                <div class="relative">
                    <select id="input-pemodal" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-semibold text-slate-700 appearance-none transition-all">
                        <option value="M Mughni Labib"  ${isEdit && item.pemodal === 'M Mughni Labib'  ? 'selected' : ''}>M Mughni Labib</option>
                        <option value="M Nurkholis"     ${isEdit && item.pemodal === 'M Nurkholis'     ? 'selected' : ''}>M Nurkholis</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500"><i class="fa-solid fa-chevron-down"></i></div>
                </div>
            </div>`;
    } else if (type === 'pengeluaran') {
        const cats = ['Biaya Iklan', 'Software/Tools', 'Akun Ads', 'Lainnya'];
        fieldsHtml = `
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Tanggal</label>
                <input type="date" id="input-tanggal" required value="${isEdit ? item.tanggal : today}"
                    class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-semibold text-slate-700 transition-all">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Kategori Biaya</label>
                <div class="relative">
                    <select id="input-kategori" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-semibold text-slate-700 appearance-none transition-all">
                        ${cats.map(c => `<option value="${c}" ${isEdit && item.kategori === c ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500"><i class="fa-solid fa-chevron-down"></i></div>
                </div>
            </div>`;
    } else if (type === 'omset') {
        fieldsHtml = `
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Bulan Omset</label>
                <input type="month" id="input-bulan" required value="${isEdit ? item.bulan : monthNow}"
                    class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-semibold text-slate-700 transition-all">
            </div>`;
    }

    fieldsHtml += `
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Nominal (Rp)</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 font-extrabold">Rp</div>
                <input type="number" id="input-nominal" required value="${isEdit ? item.nominal : ''}" min="0" step="1000"
                    class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-extrabold text-xl text-slate-800 transition-all">
            </div>
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Keterangan / Catatan</label>
            <textarea id="input-keterangan" rows="2" required placeholder="Tuliskan rincian..."
                class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-medium text-slate-700 transition-all">${isEdit ? item.keterangan : ''}</textarea>
        </div>`;

    document.getElementById('form-fields').innerHTML = fieldsHtml;
    document.getElementById('form-modal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('form-modal').classList.add('hidden');
    document.getElementById('data-form').reset();
}

function handleFormSubmit(e) {
    e.preventDefault();
    const type   = document.getElementById('form-type').value;
    const id     = document.getElementById('form-id').value;
    const isEdit = !!id;

    const formData = {
        nominal:    parseFloat(document.getElementById('input-nominal').value),
        keterangan: document.getElementById('input-keterangan').value,
        penginput:  appState.user.username
    };

    if (type === 'deposit')     { formData.tanggal = document.getElementById('input-tanggal').value; formData.pemodal   = document.getElementById('input-pemodal').value; }
    if (type === 'withdraw')    { formData.tanggal = document.getElementById('input-tanggal').value; formData.pemodal   = document.getElementById('input-pemodal').value; }
    if (type === 'pengeluaran') { formData.tanggal = document.getElementById('input-tanggal').value; formData.kategori  = document.getElementById('input-kategori').value; }
    if (type === 'omset')       { formData.bulan   = document.getElementById('input-bulan').value; }

    const ts = nowTimestamp();

    if (isEdit) {
        const idx     = appState.data[type].findIndex(d => d.id === id);
        const oldData = appState.data[type][idx];
        const alasan  = document.getElementById('edit-reason').value;
        appState.data.logRevisi.push({
            id: genId('LOG'), timestamp: ts, jenis: type.toUpperCase(),
            id_transaksi: id,
            perubahan: `Update | Alasan: ${alasan} | Nominal: ${formatRp(oldData.nominal)} → ${formatRp(formData.nominal)}`,
            pengubah: appState.user.username
        });
        appState.data[type][idx] = { ...oldData, ...formData };
    } else {
        const prefix = type === 'deposit' ? 'DEP' : type === 'pengeluaran' ? 'PENG' : type === 'withdraw' ? 'WD' : 'OMS';
        if(!appState.data[type]) appState.data[type] = []; 
        appState.data[type].push({ id: genId(prefix), timestamp: ts, ...formData });
    }

    saveData(appState.data);
    closeModal();
    loadView(type);
    showToast(isEdit ? 'Data berhasil diperbarui!' : 'Data berhasil ditambahkan!');
}

// ============================================================
//  DELETE
// ============================================================
function confirmDelete(type, id) {
    appState.deleteTarget = { type, id };
    document.getElementById('delete-modal').classList.remove('hidden');
}

function closeDeleteModal() {
    document.getElementById('delete-modal').classList.add('hidden');
    appState.deleteTarget = null;
}

function executeDelete() {
    const { type, id } = appState.deleteTarget;
    appState.data[type] = appState.data[type].filter(d => d.id !== id);
    appState.data.logRevisi.push({
        id: genId('LOG'), timestamp: nowTimestamp(),
        jenis: type.toUpperCase(),
        id_transaksi: id, perubahan: 'DATA DIHAPUS', pengubah: appState.user.username
    });
    saveData(appState.data);
    closeDeleteModal();
    loadView(type);
    showToast('Data berhasil dihapus.', 'error');
}
</script>
</body>
</html>
